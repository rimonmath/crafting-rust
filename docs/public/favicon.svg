<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22242B"/>
      <stop offset="100%" stop-color="#101115"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7543"/>
      <stop offset="60%" stop-color="#E2430E"/>
      <stop offset="100%" stop-color="#BA2E00"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Centered 8-Tooth Rust Gear (cx=32, cy=32, r_out=26, r_in=15) -->
  <path fill="url(#rust)" fill-rule="evenodd" clip-rule="evenodd" d="
    M 28 6 L 36 6 L 37.2 11.2 C 38.8 11.7 40.4 12.4 41.8 13.3 L 46.5 10.6 L 51.4 15.5 L 48.7 20.2 C 49.6 21.6 50.3 23.2 50.8 24.8 L 56 26 L 56 34 L 50.8 35.2 C 50.3 36.8 49.6 38.4 48.7 39.8 L 51.4 44.5 L 46.5 49.4 L 41.8 46.7 C 40.4 47.6 38.8 48.3 37.2 48.8 L 36 54 L 28 54 L 26.8 48.8 C 25.2 48.3 23.6 47.6 22.2 46.7 L 17.5 49.4 L 12.6 44.5 L 15.3 39.8 C 14.4 38.4 13.7 36.8 13.2 35.2 L 8 34 L 8 26 L 13.2 24.8 C 13.7 23.2 14.4 21.6 15.3 20.2 L 12.6 15.5 L 17.5 10.6 L 22.2 13.3 C 23.6 12.4 25.2 11.7 26.8 11.2 Z
    M 32 17 C 23.7 17 17 23.7 17 32 C 17 40.3 23.7 47 32 47 C 40.3 47 47 40.3 47 32 C 47 23.7 40.3 17 32 17 Z
  "/>

  <!-- Anvil Silhouette Centered in Lower Half -->
  <path fill="url(#silver)" d="
    M 22 38 L 42 38 C 43.5 38 44 39 43 40 L 41 41.5 C 39.5 42 39 43.5 40 45 L 24 45 C 25 43.5 24.5 42 23 41.5 L 21 40 C 20 39 20.5 38 22 38 Z
  "/>

  <!-- Craftsman Hammer angled striking toward anvil -->
  <g transform="translate(30, 31) rotate(35)">
    <!-- Hammer Head striking face down -->
    <rect x="-6" y="-3" width="12" height="6" rx="1.5" fill="#FFFFFF"/>
    <!-- Handle extending upward -->
    <rect x="-1.5" y="-18" width="3" height="15" rx="1.5" fill="#E2E8F0"/>
    <rect x="-2" y="-19" width="4" height="2" rx="0.5" fill="#94A3B8"/>
  </g>

  <!-- Luminous Forge Spark at strike point -->
  <path fill="url(#gold)" d="
    M 31 34.5 Q 31 37 28.5 37 Q 31 37 31 39.5 Q 31 37 33.5 37 Q 31 37 31 34.5 Z
  "/>
  <circle cx="31" cy="37" r="1.3" fill="#FFFFFF"/>
</svg>
